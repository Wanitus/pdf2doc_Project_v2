<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>แปลง PDF เป็น Word ภาษาไทย</title>
</head>
<body>
    <h2>ระบบแปลง PDF เป็น Word</h2>
    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="pdf_file" accept=".pdf" required>
        <button type="submit">แปลงไฟล์</button>
    </form>
</body>
</html>
